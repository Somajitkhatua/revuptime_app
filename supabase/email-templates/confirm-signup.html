<!doctype html>
<html lang="en">
<body style="margin:0;background:#f2f6fb;font-family:Arial,sans-serif;color:#17304d">
  <div style="max-width:480px;margin:32px auto;padding:32px;background:white;border-radius:16px">
    <h1 style="font-size:24px;color:#0085ff">RevUpTime</h1>
    <h2 style="font-size:20px">Verify your email</h2>
    <p>Enter this code in RevUpTime to verify your account:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px;padding:20px;background:#edf5ff;text-align:center">{{ .Token }}</p>
    <p>This code is valid for a limited time. Use the newest code if you request another email.</p>
    <p style="font-size:13px;color:#64748b">If you did not request this account, ignore this email. Do not share your code.</p>
  </div>
</body>
</html>
